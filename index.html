<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Murdoku Pro</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .hidden { display: none; }
        .game-wrapper { display: inline-grid; grid-template-columns: 150px 1fr; margin-top: 20px; }
        #grid-container { display: grid; gap: 2px; }
        .cell { width: 40px; height: 40px; border: 1px solid black; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .restricted { background-color: #555; cursor: not-allowed; }
        .header-cell { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <h1>Bienvenido al Murdoku</h1>
        <p>Reglas: Descubre quién es el asesino usando la lógica. Una persona por fila y columna.</p>
        <button onclick="iniciarProceso()">Comenzar Juego</button>
    </div>

    <div id="pantalla-juego" class="hidden">
        <h2 id="titulo-nivel"></h2>
        <div id="pistas-container" style="text-align: left; margin: 20px;"></div>
        <div class="game-wrapper">
            <div id="row-headers"></div>
            <div id="grid-container"></div>
        </div>
    </div>

    <script src="juego.js"></script>
</body>
</html>
