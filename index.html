<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Murdoku Pro</title>
    <style>
        /* Un poco de CSS básico para que las etiquetas se vean ordenadas */
        .game-wrapper { display: grid; grid-template-columns: 100px 1fr; }
        #col-headers { display: grid; grid-template-columns: repeat(6, 40px); gap: 2px; margin-left: 100px; }
        #row-headers { display: grid; grid-template-rows: repeat(6, 40px); gap: 2px; }
        #grid-container { display: grid; grid-template-columns: repeat(6, 40px); gap: 2px; }
        .header-cell { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Mi Murdoku</h1>
    <div id="pistas-container"></div>
    
    <div class="game-wrapper">
        <div id="row-headers"></div>
        <div id="main-board">
            <div id="col-headers"></div>
            <div id="grid-container"></div>
        </div>
    </div>

    <script src="juego.js"></script>
</body>
</html>
