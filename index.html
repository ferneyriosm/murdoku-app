<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Murdoku Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; padding: 20px; }
        .hidden { display: none; }
        
        #pantalla-juego { max-width: 800px; margin: 0 auto; }
        
        /* Contenedor del tablero */
        #grid-container { 
            display: grid; 
            gap: 2px; 
            margin: 20px auto; 
            justify-content: center;
        }
        
        .cell { 
            width: 50px; 
            height: 50px; 
            border: 1px solid #999; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            background-color: white; 
            font-weight: bold;
        }
        
        .restricted { 
            background-color: #d1d8e0; 
            color: #4b6584; 
            font-size: 10px; 
            text-align: center; 
            border: 1px solid #a5b1c2; 
            cursor: not-allowed; 
        }

        #pistas-container { 
            text-align: left; 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <h1>Bienvenido al Murdoku</h1>
        <p>Reglas: Descubre quién es el asesino usando la lógica.</p>
        <button onclick="iniciarProceso()">Comenzar Juego</button>
    </div>

    <div id="pantalla-juego" class="hidden">
        <h2 id="titulo-nivel"></h2>
        <div id="pistas-container"></div>
        <div id="grid-container"></div>
    </div>

    <script src="juego.js"></script>
</body>
</html>
