<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Murdoku Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #f0f2f5; padding: 20px; }
        .hidden { display: none; }
        
        #pantalla-juego { max-width: 800px; margin: 0 auto; }
        
        #grid-container { 
            display: grid; 
            gap: 2px; 
            margin: 20px auto; 
            justify-content: center;
            background-color: #333;
            padding: 2px;
            border: 2px solid #333;
        }
        
        .cell { 
            width: 50px; 
            height: 50px; 
            background-color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-weight: bold;
        }

        /* Objetos prohibidos (No puede estar ocupado) */
        .bloqueado { 
            background-color: #dcdde1; 
            color: #7f8c8d; 
            font-size: 8px; 
            text-align: center; 
            cursor: not-allowed; 
        }

        /* Objetos usables (Puede estar ocupado) */
        .usable { 
            background-color: #f1f2f6; 
            border: 1px dashed #a5b1c2;
            cursor: pointer;
        }

        #pistas-container { 
            text-align: left; 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <h1>Bienvenido al Murdoku</h1>
        <p>Reglas: Descubre quién es el asesino usando la lógica.</p>
        <button onclick="iniciarProceso()">Comenzar Juego</button>
    </div>

    <div id="pantalla-juego" class="hidden">
        <h2 id="titulo-nivel"></h2>
        <div id="pistas-container"></div>
        <div id="grid-container"></div>
    </div>

    <script src="juego.js"></script>
</body>
</html>
