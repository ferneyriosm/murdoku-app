
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Murdoku Pro</title>
    <style>
        /* Fondo de página suave para que el tablero no sea un lienzo blanco vacío */
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #eef2f3; padding: 20px; }
        
        .hidden { display: none; }
        
        /* Contenedor principal que mantiene el tablero y el marcador juntos */
        .game-wrapper { 
            position: relative; 
            max-width: 400px; 
            margin: 20px auto; 
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); /* Esto le da profundidad sin el fondo gris feo */
        }

        #grid-container { 
            display: grid; 
            gap: 0px; 
            justify-content: center;
            border: 1px solid #ccc;
        }
        
        .cell { 
            width: 55px; height: 55px; 
            background-color: white; 
            border: 1px solid #e0e0e0; /* Bordes suaves */
            position: relative; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer;
        }

        /* Marcador de puntos en esquina inferior */
        .score-board {
            position: absolute; bottom: 10px; right: 10px;
            background: #2f3640; color: white;
            padding: 5px 10px; border-radius: 5px;
            font-size: 0.9rem; font-weight: bold;
        }

        .object-name { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #b2bec3; pointer-events: none; }
        .mark { font-size: 24px; font-weight: bold; color: #2c3e50; pointer-events: none; }
        .bloqueado { background-color: #f8f9fa; cursor: not-allowed; }

        #pistas-container { text-align: left; background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: #2f3640; color: white; }
    </style>
</head>
<body>
    <div id="pantalla-inicio">
        <h1>Bienvenido al Murdoku</h1>
        <p>Reglas: Descubre quién es el asesino usando la lógica. Una persona por fila y columna.</p>
        <button onclick="iniciarProceso()">Comenzar Juego</button>
    </div>

    <div id="pantalla-juego" class="hidden">
        <h2 id="titulo-nivel"></h2>
        <div id="pistas-container"></div>
        
        <div class="game-wrapper">
            <div id="grid-container"></div>
            <div class="score-board">Pts: <span id="puntos">0</span></div>
        </div>

        <button onclick="juego.comprobar()">Comprobar Solución</button>
        <button id="btn-siguiente" class="hidden">Siguiente Nivel</button>
    </div>
    <script src="juego.js"></script>
</body>
</html>
