<!DOCTYPE html>
<!--12-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Murdoku Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            background-color: #eef2f3; 
            padding: 20px; 
        }
        
        .hidden { display: none; }
        
        /* Contenedor principal que envuelve el tablero y el marcador */
        .game-wrapper { 
            position: relative; 
            display: inline-block;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            margin: 20px auto;
        }

        #grid-container { 
            display: grid; 
            gap: 0px; 
            justify-content: center;
            border: 1px solid #ccc;
        }
        
        .cell { 
            width: 55px; 
            height: 55px; 
            background-color: white; 
            border: 1px solid #e0e0e0;
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer;
            box-sizing: border-box;
        }

        /* Nombre del objeto (esquina superior izquierda) */
        .object-name { 
            position: absolute; 
            top: 2px; 
            left: 4px; 
            font-size: 9px; 
            color: #b2bec3; 
            pointer-events: none; 
        }

        /* Marca (O / X) */
        .mark { 
            font-size: 24px; 
            font-weight: bold; 
            color: #2c3e50; 
            pointer-events: none; 
        }

        .bloqueado { background-color: #f8f9fa; cursor: not-allowed; }

        /* Marcador de puntos en esquina inferior derecha */
        .score-board {
            position: absolute; 
            bottom: 10px; 
            right: 10px;
            background: #2f3640; 
            color: white;
            padding: 5px 10px; 
            border-radius: 5px;
            font-size: 0.9rem; 
            font-weight: bold;
            pointer-events: none;
        }

        #pistas-container { 
            text-align: left; 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 0 auto 20px auto; 
            max-width: 400px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        button { 
            padding: 10px 20px; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            background: #2f3640; 
            color: white; 
            font-size: 16px;
        }
        
        button:hover { background: #57606f; }
    </style>
</head>
<body>

    <div id="pantalla-inicio">
        <h1>Bienvenido al Murdoku</h1>
        <button onclick="iniciarProceso()">Comenzar Juego</button>
    </div>

    <div id="pantalla-juego" class="hidden">
        <h2 id="titulo-nivel"></h2>
        <div id="pistas-container"></div>
        
        <div class="game-wrapper">
            <div id="grid-container"></div>
            <div class="score-board">Pts: <span id="puntos">0</span></div>
        </div>
        
        <br>
        <button onclick="juego.comprobar()">Comprobar Solución</button>
        <button id="btn-siguiente" class="hidden">Siguiente Nivel</button>
    </div>

    <script src="juego.js"></script>
</body>
</html>
